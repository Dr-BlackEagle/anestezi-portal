name: Tek seferlik - kongre ekle
on:
  workflow_dispatch:
    inputs:
      veri:
        description: 'Veri (base64)'
        required: false
        default: ''
      mod:
        description: 'Mod'
        required: false
        default: 'incele'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Anahtar
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - run: NODE_PATH=functions/node_modules node scripts/kongre-ekle.js
        env: { EP_DATA: '${{ inputs.veri }}', MOD: '${{ inputs.mod }}' }
