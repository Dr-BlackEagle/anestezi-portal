<style>
:root{
  /* Düzen: tek sütun mobil uygulama (en fazla 560px). Açık gri zemin, beyaz kartlar; arduvaz lacivert yalnızca yapı blokları için (özet kartı, seçili gün), tek vurgu rengi mürdüm (düğmeler, seçili sekme, sen). Gövde yazıları gri. Altta düz gezinme çubuğu. */
  --bg:#F1F1F5; --surface:#FFFFFF; --surface-2:#F6F6F9; --field:#FFFFFF;
  --ink:#2B2D45; --ink-2:#55576B; --muted:#6C6E82; --sub:#6C6E82; --line:#E5E5EC; --line-2:#D4D4DE;
  --navy:#2E3049; --navy-ink:#FFFFFF; --ind:#ECEAF3;
  --plum:#973F8A; --plum-hi:#D98BCB; --plum-soft:#F4E6F1;--err-ink:#B3261E;--err-ring:rgba(179,38,30,.14); --plum-line:#E6CBE0;
  --gold:var(--plum); --gold-ink:var(--plum); --gold-soft:var(--plum-soft); --gold-line:var(--plum-line);
  --me:#F4E3F1; --me-ink:#7A2E6E;
  --crit:#B3261E; --crit-soft:#FBE7E4;
  --track:#E7E7EE; --bar:#DCDCE6;
  --tab-ink:#8A8CA0; --tab-sub:#6C6E82;
  --card-bg:rgba(255,255,255,.62); --card-line:rgba(255,255,255,.85); --card-shadow:0 1px 2px rgba(43,45,69,.04),0 8px 24px rgba(43,45,69,.06); --glass-bg:rgba(255,255,255,.58); --glass-line:rgba(151,63,138,.16); --glass-hi:rgba(255,255,255,.95);
  --btn-bg:linear-gradient(180deg,rgba(181,95,166,.92) 0%,rgba(151,63,138,.94) 100%); --btn-line:rgba(255,255,255,.38); --btn-shadow:0 6px 16px rgba(151,63,138,.26);
  --nav-bg:rgba(241,241,245,.78); --wave:151,63,138; --wave-a:1;
  --gl-fill:linear-gradient(180deg,#CB8BBF 0%,#B262A5 46%,#963E89 54%,#8C3880 100%); --gl-edge:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.15) 55%,rgba(90,20,80,.30));
  --gf-fill:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.55)); --gf-edge:linear-gradient(180deg,#FFFFFF,rgba(151,63,138,.24));
  --nv-fill:linear-gradient(180deg,#5C5F88 0%,#41446B 46%,#2F3250 54%,#2B2D48 100%); --gl-glow:0 8px 18px rgba(151,63,138,.30),0 2px 4px rgba(151,63,138,.16);
  --f:"Roboto",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}

  --bg:#1B1C29; --surface:#252736; --surface-2:#2D2F41; --field:#252736;

    --gold:var(--plum); --gold-ink:var(--plum); --gold-soft:var(--plum-soft); --gold-line:var(--plum-line);

    --btn-bg:linear-gradient(180deg,rgba(184,98,168,.9) 0%,rgba(148,62,132,.92) 100%); --btn-line:rgba(255,255,255,.22); --btn-shadow:0 6px 16px rgba(0,0,0,.35);
    --nav-bg:rgba(27,28,41,.80); --wave:227,163,214; --wave-a:.8;
  --gl-fill:linear-gradient(180deg,#CC82BE 0%,#AC579E 46%,#8F3B83 54%,#86367A 100%); --gl-edge:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.08) 55%,rgba(0,0,0,.35));
  --gf-fill:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05)); --gf-edge:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05));
  --nv-fill:linear-gradient(180deg,#5E628F 0%,#42466F 46%,#31345A 54%,#2C2F52 100%); --gl-glow:0 8px 18px rgba(0,0,0,.38),0 2px 4px rgba(0,0,0,.25);
  --card-bg:rgba(37,39,54,.58); --card-line:rgba(255,255,255,.08); --card-shadow:0 8px 24px rgba(0,0,0,.25); --glass-bg:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.16);
  --btn-bg:linear-gradient(180deg,rgba(184,98,168,.9) 0%,rgba(148,62,132,.92) 100%); --btn-line:rgba(255,255,255,.22); --btn-shadow:0 6px 16px rgba(0,0,0,.35);
  --nav-bg:rgba(27,28,41,.80); --wave:227,163,214; --wave-a:.8;
  --gl-fill:linear-gradient(180deg,#CC82BE 0%,#AC579E 46%,#8F3B83 54%,#86367A 100%); --gl-edge:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.08) 55%,rgba(0,0,0,.35));
  --gf-fill:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05)); --gf-edge:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05));
  --nv-fill:linear-gradient(180deg,#5E628F 0%,#42466F 46%,#31345A 54%,#2C2F52 100%); --gl-glow:0 8px 18px rgba(0,0,0,.38),0 2px 4px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#1B1C29; --surface:#252736; --surface-2:#2D2F41; --field:#252736;
  --ink:#ECECF3; --ink-2:#C2C3D1; --muted:#9A9CB0; --sub:#9A9CB0; --line:#33354A; --line-2:#42445A;
  --navy:#34375A; --navy-ink:#FFFFFF; --ind:#34364D;
  --plum:#E3A3D6; --plum-hi:#E3A3D6; --plum-soft:rgba(227,163,214,.12);--err-ink:#F2B8B5;--err-ring:rgba(242,184,181,.18); --plum-line:rgba(227,163,214,.32);
  --gold:var(--plum); --gold-ink:var(--plum); --gold-soft:var(--plum-soft); --gold-line:var(--plum-line);
  --me:rgba(227,163,214,.18); --me-ink:#F0C4E7;
  --crit:#F2A097; --crit-soft:rgba(242,160,151,.12);
  --track:#33354A; --bar:#3B3E55;
  --tab-ink:#9A9CB0; --tab-sub:#9A9CB0;
  --card-bg:rgba(37,39,54,.58); --card-line:rgba(255,255,255,.08); --card-shadow:0 8px 24px rgba(0,0,0,.25); --glass-bg:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.16);
  --btn-bg:linear-gradient(180deg,rgba(184,98,168,.9) 0%,rgba(148,62,132,.92) 100%); --btn-line:rgba(255,255,255,.22); --btn-shadow:0 6px 16px rgba(0,0,0,.35);
  --nav-bg:rgba(27,28,41,.80); --wave:227,163,214; --wave-a:.8;
  --gl-fill:linear-gradient(180deg,#CC82BE 0%,#AC579E 46%,#8F3B83 54%,#86367A 100%); --gl-edge:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.08) 55%,rgba(0,0,0,.35));
  --gf-fill:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05)); --gf-edge:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05));
  --nv-fill:linear-gradient(180deg,#5E628F 0%,#42466F 46%,#31345A 54%,#2C2F52 100%); --gl-glow:0 8px 18px rgba(0,0,0,.38),0 2px 4px rgba(0,0,0,.25);
  color-scheme:dark;
}
.t-orange,.t-blue,.t-teal,.t-yellow,.t-purple,.t-red,.t-slate{--tc:var(--ink);--tbg:transparent}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:transparent}
html,body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg)}
.bgfx canvas{position:absolute;inset:0;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f);margin:0;line-height:1.2;font-weight:700;text-wrap:balance}
p{margin:0}
a{color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted)}
.eyebrow{font-size:14px;color:var(--muted)}

/* Üst başlık */
.hdr{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top-in{display:flex;align-items:center;gap:8px;min-height:56px}
.top-t{flex:1;min-width:0}
.ttl{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bar-a{display:flex;gap:0;flex-shrink:0;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--ink);flex-shrink:0;text-decoration:none}
.icon-btn:hover{background:var(--ind)}
.icon-btn svg{width:24px;height:24px}
.brand{width:54px;height:54px;display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.brand svg{width:48px;height:48px;stroke-width:1.5}
.hero-in{padding:8px 0 4px;gap:12px}
.hero-in .ttl{font-size:28px;letter-spacing:-.02em}
.hero-in .eyebrow{font-size:16.5px;margin-top:3px}

main{max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(108px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
main.no-tabs{padding-bottom:calc(36px + env(safe-area-inset-bottom))}
main>*{min-width:0}

/* Kartlar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:600}
.card-h .muted{font-size:13.5px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 0}
.sec-h h2{font-size:18px;font-weight:600}
.sec-a{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.link{font-weight:600;font-size:14px;text-decoration:none;padding:6px 2px}
.empty{padding:20px 14px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r)}
.empty-card{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.banner.warn{background:var(--gold-soft);border-color:var(--gold-line)}
.banner>div{flex:1;min-width:0}
.banner b{display:block;font-size:15.5px}
.banner small{color:var(--muted);font-size:13.5px;display:block}

/* Özet kartı (QalBit'teki öne çıkan kart gibi) */
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:20px;border-color:var(--gold-line)}
.sum-l{display:flex;flex-direction:column;min-width:0}
.dotline{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0}
.dot.off{background:var(--line-2)}
.sum-sub{font-size:15px;color:var(--sub);margin-top:6px;overflow-wrap:anywhere}
.sum-big{text-align:right;align-self:center}
.sum-big b{display:block;font-size:46px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.sum-big small{font-size:13px;color:var(--muted)}
.sum-foot{grid-column:1/-1;display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:14.5px;color:var(--sub);padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.sum-foot b{color:var(--ink);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:4px;height:22px;flex-shrink:0}
.spark i{display:block;width:5px;border-radius:2px;background:var(--gold)}
.spark i.z{height:2px!important;background:var(--line-2)}
.big{font-size:38px;line-height:1.05;font-weight:300;font-variant-numeric:tabular-nums;color:var(--ink)}
.big small{font-size:15px;font-weight:400;color:var(--muted);margin-left:2px}
.cta{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--ink)}
.cta::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0}
.cta span{flex:1;min-width:0;font-weight:500;font-size:15px}
.cta a{color:var(--navy-ink);background:var(--navy);font-weight:600;text-decoration:none;white-space:nowrap;font-size:13.5px;padding:8px 14px;border-radius:999px}

/* Ana sayfa bölümleri */
.nbc-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:8px}.nbc-ft .nbc-all{border-top:0;padding-top:0;flex-shrink:0}
.nbc-my{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nbc-my b{color:#fff;font-weight:600}.nbc-my svg{width:15px;height:15px;flex-shrink:0;color:var(--plum-hi)}
.card.tone{background:var(--noise),linear-gradient(160deg,rgba(54,57,87,.96),rgba(46,48,73,.97));border-color:rgba(46,48,73,.9);color:#fff}
.card.tone h2{color:#fff}.card.tone .card-h .muted{color:rgba(255,255,255,.6)}
.card.tone .gl{color:var(--plum-hi);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.card.tone .gn{color:rgba(255,255,255,.85)}.card.tone .g+.g>.gl,.card.tone .g+.g>.gn{border-top-color:rgba(255,255,255,.12)}.card.tone .gs{column-gap:0}.card.tone .gl{padding-right:12px}.card.tone .gn em{color:rgba(255,255,255,.55)}.card.tone .sep{color:rgba(255,255,255,.35)}
.card.tone mark.me{background:var(--plum-hi);color:#2A1027;font-weight:700}
.card.tone .week li{border-top-color:rgba(255,255,255,.12)}.card.tone .week li b{color:var(--plum-hi);font-weight:700}.card.tone .week li span{color:rgba(255,255,255,.88)}
.card.tone .week li .muted{color:rgba(255,255,255,.35)}
.card.tone .week li.is-today{background:rgba(255,255,255,.08);border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px;border-top-color:transparent}
.card.tone .week li.is-today+li{border-top-color:transparent}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:92px;padding:14px 6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:18px;text-decoration:none;color:var(--ink);text-align:center;min-width:0;transition:transform .12s}
.mt:active{transform:scale(.97)}.mt .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--ind);color:var(--plum)}.mt .ti svg{width:22px;height:22px;stroke-width:1.7}
.mt b{font-size:13px;font-weight:600;line-height:1.2}.mt small{font-size:11px;line-height:1.25;color:var(--sub);font-weight:600;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:130px;padding:18px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;text-decoration:none;color:var(--ink);min-width:0;transition:transform .12s ease}
.tile:active{transform:scale(.98)}
.tile .ti{width:30px;height:30px;display:grid;place-items:center;color:var(--ink);background:transparent}
.tile .ti svg{width:28px;height:28px;stroke-width:1.6}
.tile b{display:block;font-size:16.5px;font-weight:600;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3;overflow-wrap:anywhere;margin-top:4px}
.tile small.hot{color:var(--sub);font-weight:600}
.tile.feat{border-color:var(--gold-line)}
.tile.feat .ti{color:var(--gold-ink)}

/* Alt gezinme çubuğu (Material tarzı, seçili sekmede kayan yumuşak hap) */
.tabbar{--padl:max(6px,calc((100% - 560px) / 2));--padr:max(6px,calc((100% - 560px) / 2));position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px var(--padr) calc(10px + env(safe-area-inset-bottom)) var(--padl);background:var(--bg);border-top:1px solid var(--line)}
.tabbar[hidden]{display:none}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:4px;min-height:60px;text-decoration:none;color:var(--tab-sub);font-size:12.5px;font-weight:500;min-width:0}
.tab svg{width:24px;height:24px;color:var(--tab-ink);stroke-width:1.8}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{color:var(--ink);font-weight:600}
.tab.on svg{color:var(--ink)}
.fab{position:absolute;top:24px;left:calc(var(--padl) + (100% - var(--padl) - var(--padr)) * (var(--i,0) + .5) / 5);width:0;height:0;transition:left .45s cubic-bezier(.3,1.2,.5,1),opacity .2s ease}
.fab.init{transition:none}
.fab.off{opacity:0}
.bump{display:none}
.bub{position:absolute;left:-32px;top:-16px;width:64px;height:32px;border-radius:16px;background:var(--ind);z-index:0}
.bub svg{display:none}
.bub.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scaleX(.45);opacity:.5}100%{transform:none;opacity:1}}

/* Duyurular */
a.ann{display:block;text-decoration:none;color:inherit}
.card.ann.onemli{border-color:var(--gold-line)}
.ann.onemli .pill.warn{display:none}
.ann.onemli h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:.12em}
.ann h3{font-size:16.5px;font-weight:600}
.ann p{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5;color:var(--ink-2)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.ann-acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

/* Düğmeler ve kontroller */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--navy);background:var(--navy);color:var(--navy-ink);font-weight:500;cursor:pointer;text-decoration:none;font-size:15px;text-align:center;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.danger{background:transparent;border-color:var(--line-2);color:var(--muted)}
.btn.danger svg{color:var(--crit)}
.btn.danger-fill{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;gap:6px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.wa{background:#1e9e57;border-color:#1e9e57;color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:999px;font-weight:500;font-size:14.5px;cursor:pointer;color:var(--muted);min-width:0;padding:0 6px}
.seg button[aria-selected="true"]{background:var(--ind);color:var(--ink);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:6px}
.switch b{font-size:18px;font-weight:500;text-align:center;flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ind);color:var(--ink);border-color:transparent}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.me{background:var(--me);color:var(--me-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-2);overflow-wrap:anywhere}
.chip.me{background:var(--me);color:var(--me-ink);border-color:var(--gold-line)}
mark.me{background:var(--me);color:var(--me-ink);border-radius:4px;padding:0 4px}

/* Nöbet günleri */
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.day[role="button"]{cursor:pointer}
.day .dd{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;background:var(--bg);border-radius:12px;padding:6px 0;align-self:start}
.day .dd b{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.day .dd span{font-size:11.5px;color:var(--muted);font-weight:600}
.day.is-today{border-color:var(--navy)}
.day.is-today .dd{background:var(--navy);color:var(--navy-ink)}
.day.is-today .dd span{color:var(--navy-ink)}
.day.has-me{box-shadow:inset 3px 0 0 var(--gold)}
.day.is-past{opacity:.5}
.gs{display:flex;flex-direction:column;min-width:0}
.g{display:grid;grid-template-columns:minmax(78px,32%) minmax(0,1fr);gap:8px;padding:5px 0;font-size:14.5px}
.g+.g{border-top:1px solid var(--line)}
.gl{color:var(--muted);font-size:13.5px;padding-top:1px;overflow-wrap:anywhere}
.gn{font-weight:500;color:var(--ink-2);overflow-wrap:anywhere;letter-spacing:.01em}
.gn em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted);margin-left:3px;text-transform:lowercase}
.gn .sep{font-style:normal;color:var(--line-2);font-weight:400}
.duties{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.duties li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.duties li:first-child{border-top:0;padding-top:2px}
.duties li>div{flex:1;min-width:140px}
.duties b{display:block;font-size:15px;font-weight:600}
.duties span{font-size:13.5px;color:var(--muted)}

/* Haftalık */
.dtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dtabs button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;border:1px solid var(--line);background:var(--surface);border-radius:16px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500;padding:7px 2px}
.dtabs button b{font-size:20px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.dtabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.dtabs button[aria-selected="true"] b{color:var(--navy-ink)}
.dtabs button.is-today:not([aria-selected="true"]){border-color:var(--navy)}
.dtabs .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:3px}
.dtabs .dot.no{background:transparent}
.lh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;margin-bottom:4px}
.rows{margin:0;display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:minmax(96px,42%) minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
.r dt{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.r dd{margin:0;font-weight:500;font-size:14.5px;color:var(--ink-2);overflow-wrap:anywhere;text-align:right;letter-spacing:.01em}
.r.has-me dt{color:var(--ink);font-weight:600}
.week{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.week li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:8px 0;font-size:15px;border-top:1px solid var(--line)}
.week li:first-child{border-top:0;padding-top:0}
.week li b{color:var(--muted);font-size:13.5px;font-weight:500;padding-top:1px}
.week li.is-today b{color:var(--ink);font-weight:600}
.week li span{font-weight:500;color:var(--ink-2);overflow-wrap:anywhere;text-align:right}
.note{white-space:pre-wrap;font-size:14.5px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:16px;padding:12px 14px;overflow-wrap:anywhere}

/* İşlemler */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span svg{width:15px;height:15px;flex-shrink:0;color:var(--muted)}
.stat b{display:block;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.ir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ir .in b{display:block;font-size:15.5px;font-weight:500;overflow-wrap:anywhere}
.ir .in small{font-size:13px;color:var(--muted)}
.ic{display:flex;align-items:center;gap:6px}
.cb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font-size:22px;font-weight:400;cursor:pointer;display:grid;place-items:center;line-height:1;color:var(--ink)}
.cb.plus{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.cb[disabled]{opacity:.35;cursor:default}
.ic output{min-width:30px;text-align:center;font-size:21px;font-weight:400;font-variant-numeric:tabular-nums}
.date-pill{display:flex;align-items:center;gap:8px}
.date-pill input{min-height:40px;padding:6px 12px;width:auto;font-size:15px;border-radius:999px}
.save-st{font-size:13px;color:var(--muted)}
.save-st.err{color:var(--crit);font-weight:700}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.recent li:first-child{border-top:0}
.recent b{font-size:13.5px;color:var(--muted);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:140px;border-bottom:1px solid var(--line-2);padding-top:4px}
.bc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:transparent;cursor:pointer;padding:0;min-width:0}
.bc .bv{font-weight:500;font-size:14px;min-height:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.bc .bt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bc .bt i{display:block;width:16px;max-width:100%;background:var(--bar);border-radius:4px 4px 0 0}
.bc.on .bt i{background:var(--gold)}
.blbl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
.blbl span{text-align:center;font-size:12.5px;color:var(--muted)}
.blbl span.today{color:var(--ink);font-weight:700}
.readout{margin-top:10px}
.mtr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mtr li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:15px}
.mtr .mn{font-weight:500;overflow-wrap:anywhere}
.mtr .mv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.mtr .mv b{color:var(--ink);font-size:15px;font-weight:500;margin-right:6px}
.mtr .mt{grid-column:1/-1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.mtr .mt i{display:block;height:100%;background:var(--ink);border-radius:99px}
.minis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mini span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mini span svg{width:15px;height:15px;color:var(--muted)}
.mini b{display:block;font-size:20px;font-weight:400;margin-top:4px;overflow-wrap:anywhere;line-height:1.2}

/* Rotasyon */
.pb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.pb .pn{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.pb .pv{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.trk{grid-column:1/-1;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ink);border-radius:99px}
.pb.eksik .fill{background:var(--gold)}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.sumrow .stat{background:var(--surface-2)}
.svc{display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.svc:first-child{border-top:0}
.svc dt{font-size:14px;color:var(--muted);overflow-wrap:anywhere;padding-top:4px}
.svc dd{margin:0}
.svc.has-me dt{color:var(--ink);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.pcard .top{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pcard .top b{font-size:16px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.pcard .sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
select.inline{min-height:46px}

/* Seminer, kongre */
.ev{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start}
.ev .when{display:flex;flex-direction:column;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:7px 2px;line-height:1.1}
.ev .when b{font-size:21px;font-weight:600}
.ev .when span{font-size:11.5px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.ev h3{font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.ev .sub{font-size:14px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.ev .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ev-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ppl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.ppl li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.ppl li span:first-child{font-weight:500;overflow-wrap:anywhere;min-width:0}
.grp-h{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 4px -4px}

/* Formlar ve alt sayfa */
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13.5px;font-weight:500;color:var(--muted)}
.fld>span em{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px}
input,select,textarea{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--field);font-size:16px;min-width:0;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
textarea{min-height:120px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--ind)}
input[type="file"]{padding:10px;min-height:0}
input[type="search"]{border-radius:999px;border-color:var(--line)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;font-size:15px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--ink);flex-shrink:0}
.fs{border:1px solid var(--line);border-radius:16px;padding:10px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.fs legend{font-size:13.5px;font-weight:500;color:var(--muted);padding:0 6px}
.fs legend em{font-style:normal;font-weight:400;margin-left:4px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(17,19,24,.42)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out}
.sheet-panel::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line-2);margin:10px auto 0}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:6px 8px 10px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;font-size:19px;min-width:0;overflow-wrap:anywhere}
.sheet-body{overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sh{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-top:6px}
.menu-i{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;color:var(--ink)}
.menu-i::after{content:"›";margin-left:auto;font-size:24px;line-height:1;color:var(--muted);padding-left:8px}
.menu-i svg{width:22px;height:22px;color:var(--ink);flex-shrink:0}
.menu-i span{display:flex;flex-direction:column;min-width:0}
.menu-i b{font-size:15.5px;font-weight:500}
.menu-i small{font-size:13px;color:var(--muted)}
.menu-i.danger svg,.menu-i.danger b{color:var(--crit)}
.cc{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:6px;padding:10px;border:1px solid var(--line);border-radius:16px}
.cc .full{grid-column:1/-1}
.cc input,.cc select{min-height:42px;font-size:15px}
.share-pre{margin:0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f);font-size:14.5px;max-height:42vh;overflow:auto}
.share-acts{display:flex;flex-direction:column;gap:8px}
.err-t{color:var(--crit);font-weight:600;font-size:14px}
.ok-t{color:var(--ink);font-weight:600;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(92vw,420px)}
.tst{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500;font-size:14.5px;animation:up .18s ease-out}
.tst.err{background:var(--crit);color:#fff}
#dlg{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px}
#dlg[hidden]{display:none}
.dlg-bg{position:absolute;inset:0;background:rgba(17,19,24,.5)}
.dlg-card{position:relative;background:var(--surface);border-radius:24px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px;font-size:15.5px}
.dlg-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Açılış ekranı */
.splash{min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:20px 10px}
.splash h2{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.splash .bulb{width:120px;height:120px;color:var(--ink)}
.splash .bulb svg{width:100%;height:100%;stroke-width:1.1}
.splash p{font-size:16px;color:var(--muted);max-width:280px}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);animation:blink 1.2s infinite ease-in-out}
.dots i:first-child{background:var(--gold)}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.gate-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 4px}
.gate-intro h2{font-size:22px;font-weight:700}
.gate-intro .bulb{width:64px;height:64px}
.gate-intro .bulb svg{width:100%;height:100%;stroke-width:1.3}
.gate-p{font-size:15px;color:var(--muted);margin-top:8px}
.skel{display:none}
@media (min-width:600px){.hdr{padding-top:calc(18px + env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Mürdüm vurgu ve lacivert bloklar */
.cta a{background:var(--plum);color:var(--surface)}
.tab.on,.tab.on svg{color:var(--plum)}
.bub{background:var(--plum-soft)}
.seg button[aria-selected="true"]{background:var(--navy);color:var(--navy-ink)}
.card{border-color:transparent}
.day,.dtabs button,.stat,.tile{border-color:transparent}
.sum{background:var(--navy);border-color:var(--navy);color:#fff}
.sum .dotline{color:#fff}
.sum .dot{background:var(--plum-hi)}
.sum .sum-sub{color:rgba(255,255,255,.74)}
.sum .sum-sub a{color:#F2C6EA}
.sum .sum-big small{color:rgba(255,255,255,.7)}
.sum .sum-foot{border-top-color:rgba(255,255,255,.14);color:rgba(255,255,255,.74)}
.sum .sum-foot b{color:#fff}
.sum .spark i{background:var(--plum-hi)}
.sum .spark i.z{background:rgba(255,255,255,.25)}
.tile.feat{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--plum-line)}
.tile.feat .ti{color:var(--plum)}
.tile small.hot{color:var(--plum)}
.lh,.sh{color:var(--plum)}
.week li.is-today b{color:var(--plum)}
.gs{display:grid;grid-template-columns:fit-content(46%) minmax(0,1fr);column-gap:12px}
.g{display:contents}
.gl,.gn{padding:5px 0}
.g+.g>.gl,.g+.g>.gn{border-top:1px solid var(--line)}
.gl{overflow-wrap:normal;word-break:normal}

/* Arka plan dalgası üstünde yarı saydam kartlar ve cam düğmeler */
.card,.day,.stat,.tile,.dtabs button,.banner:not(.warn){background:var(--card-bg);border:1px solid var(--card-line);box-shadow:var(--card-shadow);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35)}
.day.is-today{border-color:var(--navy)}
.day.has-me{box-shadow:inset 3px 0 0 var(--gold),var(--card-shadow)}
.tile.feat{background:var(--card-bg)}
.sum{background:linear-gradient(160deg,rgba(54,57,87,.96),rgba(46,48,73,.97))}
.btn{position:relative;overflow:hidden;isolation:isolate;background:var(--btn-bg);border:1px solid var(--btn-line);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.10),var(--btn-shadow);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4)}
.btn::before{content:"";position:absolute;left:1px;right:1px;top:1px;height:52%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.btn.ghost::before,.btn.danger::before{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.cb.plus{position:relative;overflow:hidden}
.cb.plus::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:48%;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn.ghost{background:var(--glass-bg);color:var(--ink);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 10px rgba(43,45,69,.06)}
.btn.danger{background:var(--glass-bg);border:1px solid var(--line-2);color:var(--muted);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn.danger-fill{background:var(--crit);border-color:var(--crit);box-shadow:none}
.btn.wa{background:linear-gradient(180deg,#2bb56a,#1e9e57);border-color:rgba(255,255,255,.35)}
.cb{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cb.plus{background:var(--btn-bg);border:1px solid var(--btn-line);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),var(--btn-shadow)}
.cta a{background:var(--btn-bg);color:#fff;border:1px solid var(--btn-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.icon-btn{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet-head .icon-btn{background:transparent;border-color:transparent;box-shadow:none}
.seg{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg button[aria-selected="true"]{background:linear-gradient(180deg,#43466B,#2E3049);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px rgba(46,48,73,.25)}
.tabbar{background:var(--nav-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
.bub{background:var(--plum-soft);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-line)}
.date-pill input,input[type="search"]{background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* Mat (buzlu) cam: yarı saydam, bulanık, hafif grenli; parlama yok */
:root{--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.45 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");--mt-tile:linear-gradient(150deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.34) 100%);--mt-card:linear-gradient(150deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.56) 100%);--mt-line:rgba(255,255,255,.80);--mt-btn:linear-gradient(180deg,#A6519A 0%,#8F3A83 100%);--mt-navy:linear-gradient(180deg,#3E4166 0%,#2E3049 100%);--mt-ghost:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.42))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]){--mt-tile:linear-gradient(150deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 100%);--mt-card:linear-gradient(150deg,rgba(45,47,65,.74) 0%,rgba(37,39,54,.58) 100%);--mt-line:rgba(255,255,255,.10);--mt-btn:linear-gradient(180deg,#A9549B 0%,#8C3880 100%);--mt-navy:linear-gradient(180deg,#464A74 0%,#33365C 100%);--mt-ghost:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{--mt-tile:linear-gradient(150deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 100%);--mt-card:linear-gradient(150deg,rgba(45,47,65,.74) 0%,rgba(37,39,54,.58) 100%);--mt-line:rgba(255,255,255,.10);--mt-btn:linear-gradient(180deg,#A9549B 0%,#8C3880 100%);--mt-navy:linear-gradient(180deg,#464A74 0%,#33365C 100%);--mt-ghost:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
.tile,.tile.feat{background:var(--noise),var(--mt-tile);border:1px solid var(--mt-line);backdrop-filter:blur(24px) saturate(1.25);-webkit-backdrop-filter:blur(24px) saturate(1.25);box-shadow:0 10px 28px rgba(43,45,69,.08)}
.tile.feat{box-shadow:inset 0 0 0 1.5px var(--plum-line),0 10px 28px rgba(43,45,69,.08)}
.card,.day,.stat,.dtabs button,.banner:not(.warn){background:var(--noise),var(--mt-card);border-color:var(--mt-line)}
.sum{background:var(--noise),linear-gradient(160deg,rgba(54,57,87,.96),rgba(46,48,73,.97))}
.btn::before,.btn::after,.cb.plus::before{display:none}
.btn{background:var(--mt-btn);border:1px solid rgba(255,255,255,.18);color:#fff;text-shadow:none;box-shadow:0 6px 16px rgba(151,63,138,.22)}
.btn.ghost,.btn.danger{background:var(--noise),var(--mt-ghost);border:1px solid var(--mt-line);color:var(--ink);box-shadow:0 4px 14px rgba(43,45,69,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn.danger{color:var(--muted)}
.btn.danger-fill{background:var(--crit);border-color:var(--crit);box-shadow:none}
.btn.wa{background:linear-gradient(180deg,#25A862,#1B8F4F);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 16px rgba(30,158,87,.22)}
.cb{background:var(--noise),var(--mt-ghost);border:1px solid var(--mt-line);box-shadow:none}
.cb.plus{background:var(--mt-btn);border:1px solid rgba(255,255,255,.18);color:#fff;box-shadow:0 4px 12px rgba(151,63,138,.22);text-shadow:none}
.icon-btn{background:var(--noise),var(--mt-ghost);border:1px solid var(--mt-line);box-shadow:0 3px 10px rgba(43,45,69,.06)}
.sheet-head .icon-btn{background:transparent;border-color:transparent;box-shadow:none}
.cta a{background:var(--mt-btn);border:1px solid rgba(255,255,255,.18);text-shadow:none}
.seg{background:var(--noise),var(--mt-ghost);border:1px solid var(--mt-line)}
.seg button[aria-selected="true"]{background:var(--mt-navy);border:0;box-shadow:0 4px 10px rgba(46,48,73,.22)}
.dtabs button[aria-selected="true"]{background:var(--mt-navy);border:1px solid transparent;box-shadow:0 6px 14px rgba(46,48,73,.22)}
.day.is-today .dd{background:var(--mt-navy)}
.bub{background:var(--plum-soft);border:0;box-shadow:none}

/* Asistanlık özet kartı */
.sum{display:flex;flex-direction:column;gap:16px;padding:20px}
.sum-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sum .sum-top .dotline{font-size:15px;font-weight:500;color:rgba(255,255,255,.82)}
.sum .yr{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:600;color:#fff;white-space:nowrap}
.sum-num{display:flex;align-items:baseline;gap:8px}
.sum-num b{font-size:54px;font-weight:300;line-height:1;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums}
.sum-num span{font-size:18px;color:rgba(255,255,255,.72)}
.sum .sum-sub{margin-top:8px;font-size:14px;line-height:1.5}
.yhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:rgba(255,255,255,.62);margin-bottom:7px}
.yhead b{font-size:14px;font-weight:600;color:#fff}
.yseg{display:grid;gap:5px}
.yseg i{display:block;height:7px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}
.yseg i b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C878B9,#F0C3E6)}
.ylbl{display:grid;gap:5px;font-size:11.5px;color:rgba(255,255,255,.5);margin-top:6px}
.ylbl span.on{color:#fff;font-weight:600}
.sum-foot2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-foot2>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:11px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.sum-foot2 span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.66)}
.sum-foot2 span svg{width:14px;height:14px;color:#E3A3D6;flex-shrink:0}
.sum-foot2 b{font-size:17px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-foot2 small{font-size:12px;color:rgba(255,255,255,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-foot2 .spark{margin-top:4px;height:18px}
.sum-foot2 .spark i{background:#E3A3D6}
.sum-foot2 .spark i.z{background:rgba(255,255,255,.22)}

/* Duyurular */
.ann-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ann-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ann-ic svg{width:16px;height:16px}
.ann.onemli .pill.warn{display:inline-flex}
.ann.onemli h3::before{display:none}

.card.ann{background:var(--noise),linear-gradient(150deg,rgba(234,238,251,.95),rgba(222,228,247,.82));border:1px solid rgba(46,48,73,.10)}
.card.ann .ann-ic{background:rgba(46,48,73,.10);color:var(--navy)}
.card.ann.onemli{box-shadow:inset 4px 0 0 var(--plum),0 8px 22px rgba(46,48,73,.08)}
.card.ann.onemli .ann-ic{background:var(--plum);color:#fff}
.card.ann .pill.ok{background:rgba(255,255,255,.75);color:var(--navy)}
.card.ann .pill.warn{background:var(--plum);color:#fff}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]) .card.ann{background:var(--noise),linear-gradient(150deg,rgba(160,175,230,.13),rgba(160,175,230,.05));border-color:rgba(160,175,230,.20)}:root:not([data-theme="light"]):not([data-mode="light"]) .card.ann .ann-ic{background:rgba(160,175,230,.16);color:#C9D2F2}:root:not([data-theme="light"]):not([data-mode="light"]) .card.ann .pill.ok{background:rgba(255,255,255,.10);color:#C9D2F2}:root:not([data-theme="light"]):not([data-mode="light"]) .card.ann.onemli{box-shadow:inset 4px 0 0 #E3A3D6,0 8px 22px rgba(0,0,0,.25)}:root:not([data-theme="light"]):not([data-mode="light"]) .card.ann.onemli .ann-ic{background:#A24C92;color:#fff}:root:not([data-theme="light"]):not([data-mode="light"]) .card.ann .pill.warn{background:#A24C92;color:#fff}}
:root[data-theme="dark"]:not([data-mode="light"]) .card.ann{background:var(--noise),linear-gradient(150deg,rgba(160,175,230,.13),rgba(160,175,230,.05));border-color:rgba(160,175,230,.20)}:root[data-theme="dark"]:not([data-mode="light"]) .card.ann .ann-ic{background:rgba(160,175,230,.16);color:#C9D2F2}:root[data-theme="dark"]:not([data-mode="light"]) .card.ann .pill.ok{background:rgba(255,255,255,.10);color:#C9D2F2}:root[data-theme="dark"]:not([data-mode="light"]) .card.ann.onemli{box-shadow:inset 4px 0 0 #E3A3D6,0 8px 22px rgba(0,0,0,.25)}:root[data-theme="dark"]:not([data-mode="light"]) .card.ann.onemli .ann-ic{background:#A24C92;color:#fff}:root[data-theme="dark"]:not([data-mode="light"]) .card.ann .pill.warn{background:#A24C92;color:#fff}
:root[data-mode="dark"] .card.ann{background:var(--noise),linear-gradient(150deg,rgba(160,175,230,.13),rgba(160,175,230,.05));border-color:rgba(160,175,230,.20)}:root[data-mode="dark"] .card.ann .ann-ic{background:rgba(160,175,230,.16);color:#C9D2F2}:root[data-mode="dark"] .card.ann .pill.ok{background:rgba(255,255,255,.10);color:#C9D2F2}:root[data-mode="dark"] .card.ann.onemli{box-shadow:inset 4px 0 0 #E3A3D6,0 8px 22px rgba(0,0,0,.25)}:root[data-mode="dark"] .card.ann.onemli .ann-ic{background:#A24C92;color:#fff}:root[data-mode="dark"] .card.ann .pill.warn{background:#A24C92;color:#fff}

/* Logo */
:root{--logo-bg:#2E3049;--logo-dot:#D98BCB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]){--logo-bg:#40446F;--logo-dot:#E3A3D6}}

.brand svg.logo{width:46px;height:46px}

/* Ana sayfada sıkışık duyuru listesi */
.card.annlist{padding:4px 16px}
.annr{display:flex;align-items:center;gap:12px;padding:11px 0;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);min-width:0}
.annr:first-child{border-top:0}
.annr .ann-ic{width:30px;height:30px}
.card.ann .annr.onemli .ann-ic{background:var(--plum)!important;color:#fff!important}
.annr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.annr-t b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.annr-t small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.annr::after{content:"›";font-size:22px;line-height:1;color:var(--muted);flex-shrink:0}
.annmore{display:block;padding:10px 0 12px;border-top:1px solid var(--line);font-size:13.5px;font-weight:500;text-decoration:none;color:var(--muted);text-align:center}

/* Asistanlık kartı: sıkı düzen */
.sum{gap:12px!important;padding:16px 18px!important}
.sum .sum-top .dotline{font-size:14px}
.sum .yr{padding:3px 10px;font-size:12.5px}
.sum-num{align-items:baseline;gap:6px}
.sum-num b{font-size:40px!important}
.sum-num span{font-size:16px!important}
.sum-num em{margin-left:auto;font-style:normal;font-size:13px;color:rgba(255,255,255,.66);text-align:right}
.sum .yseg i{height:6px}
.sum-line{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;font-size:13.5px;color:rgba(255,255,255,.72);padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
.sum-line span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sum-line svg{width:15px;height:15px;color:#E3A3D6;flex-shrink:0}
.sum-line b{color:#fff;font-weight:600}
.sum .sum-sub{margin-top:0}

.card.annbar{flex-direction:column;align-items:stretch}

.annb{align-items:flex-start;padding:14px 16px 12px 14px}

async function unzip(u8,want){const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let eo=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}if(eo<0)throw new Error('zip');const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const out={};const td=new TextDecoder();for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;if(!want(name))continue;const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);const data=u8.subarray(st,st+cs);let raw;if(meth===0)raw=data;else if(meth===8)raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else continue;out[name]=td.decode(raw);}return out;}
async function readXlsx(file){const u8=new Uint8Array(await file.arrayBuffer());const f=await unzip(u8,n=>n==='xl/sharedStrings.xml'||n==='xl/workbook.xml'||n==='xl/_rels/workbook.xml.rels'||/^xl\/worksheets\/sheet\d+\.xml$/.test(n));const X=s=>new DOMParser().parseFromString(s,'application/xml');const T=(el,tag)=>Array.from(el.getElementsByTagNameNS('*',tag));const shared=f['xl/sharedStrings.xml']?T(X(f['xl/sharedStrings.xml']),'si').map(si=>T(si,'t').map(t=>t.textContent).join('')):[];let sheetPath=null;if(f['xl/workbook.xml']&&f['xl/_rels/workbook.xml.rels']){const sh=T(X(f['xl/workbook.xml']),'sheet')[0];const rid=sh&&(sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));const rel=T(X(f['xl/_rels/workbook.xml.rels']),'Relationship').find(r=>r.getAttribute('Id')===rid);if(rel){let t=rel.getAttribute('Target');t=t.replace(/^\/?xl\//,'').replace(/^\//,'');sheetPath='xl/'+t;}}if(!sheetPath||!f[sheetPath])sheetPath=Object.keys(f).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];if(!sheetPath)throw new Error('sheet');const grid=[];const colIdx=r=>{const m=/^([A-Z]+)/.exec(r||'');if(!m)return -1;let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1;};T(X(f[sheetPath]),'row').forEach(row=>{const ri=(+row.getAttribute('r')||grid.length+1)-1;const arr=[];T(row,'c').forEach((c,ci)=>{let j=colIdx(c.getAttribute('r'));if(j<0)j=ci;const t=c.getAttribute('t');const v=T(c,'v')[0];let val='';if(t==='s')val=v?shared[+v.textContent]||'':'';else if(t==='inlineStr')val=T(c,'t').map(x=>x.textContent).join('');else if(t==='b')val=v&&v.textContent==='1'?'DOĞRU':'YANLIŞ';else if(v){const num=Number(v.textContent);val=t==='str'||isNaN(num)?v.textContent:num;}arr[j]=val;});for(let j=0;j<arr.length;j++)if(arr[j]===undefined)arr[j]='';grid[ri]=arr;});for(let i=0;i<grid.length;i++)if(!grid[i])grid[i]=[];return grid;}
function parseTSV(t){const lines=t.replace(/\r/g,'').split('\n');const sep=lines.some(l=>l.includes('\t'))?'\t':(lines.some(l=>l.includes(';'))?';':'\t');return lines.map(l=>l.split(sep));}
function cellDate(v){if(typeof v==='number'&&v>30000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}const s=String(v==null?'':v).trim();let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return null;}

function parseMonthly(grid){const first=grid.findIndex(r=>r&&cellDate(r[0]));if(first<0)return null;const hdr=first>0?grid[first-1]:[];const gunler={};for(let i=first;i<grid.length;i++){const r=grid[i]||[];const d=cellDate(r[0]);if(!d)break;gunler[d]=r.slice(1).map(v=>String(v==null?'':v).trim());}let w=0;[hdr.slice(1)].concat(Object.values(gunler)).forEach(r=>r.forEach((v,j)=>{if(String(v==null?'':v).trim())w=Math.max(w,j+1);}));Object.keys(gunler).forEach(d=>{gunler[d]=Array.from({length:w},(_,j)=>up(gunler[d][j]||''));});const names=Array.from({length:w},(_,j)=>String(hdr[j+1]==null?'':hdr[j+1]).trim()||`Sütun ${j+1}`);const cnt={};Object.keys(gunler).forEach(d=>{const k=monthKey(d);cnt[k]=(cnt[k]||0)+1;});const k=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];const prevDoc=S.nobet[k]||Object.keys(S.nobet).sort().reverse().map(x=>S.nobet[x]).find(Boolean);const prev=prevDoc&&prevDoc.sutunlar&&prevDoc.sutunlar.length===w?prevDoc.sutunlar:null;const seen={};const sutunlar=names.map((n,j)=>{if(prev)return {ad:prev[j].ad,tip:prev[j].tip,grup:prev[j].grup||prev[j].ad,etiket:prev[j].etiket||''};const u=up(n);const base=u.replace(/[-\s]*\d+$/,'').trim();const dup=seen[base];seen[base]=1;const tip=/UZM/.test(u)?'uzman':(/ASİST|ASIST|AĞRI|\d/.test(u)||dup)?'asistan':'uzman';return {ad:n,tip,grup:guessGroup(u),etiket:/AĞRI/.test(u)?'ağrı':''};});Object.keys(gunler).forEach(d=>{if(monthKey(d)!==k)delete gunler[d];});return {k,gunler,sutunlar};}
function parseWeekly(grid,mon){const hi=grid.findIndex(r=>r&&r.slice(1).filter(c=>cellDate(c)).length>=2);let dates,start;if(hi>=0){dates=grid[hi].slice(1).map(cellDate).filter(Boolean).slice(0,5);start=hi+1;}else{dates=[0,1,2,3,4].map(n=>addDays(mon,n));start=0;}const n=dates.length;const bolumler=[];let cur=null;const notes=[];for(let i=start;i<grid.length;i++){const r=grid[i]||[];const label=String(r[0]==null?'':r[0]).trim();const cells=[];for(let j=0;j<n;j++)cells.push(up(r[j+1]));const filled=cells.filter(Boolean).length;if(!label&&!filled)continue;if(label&&!filled&&label===up(label)){cur={ad:up(label),satirlar:[]};bolumler.push(cur);continue;}if(!label&&filled===1&&cells[0].length>24){notes.push(cells[0]);continue;}if(!cur){cur={ad:'GENEL',satirlar:[]};bolumler.push(cur);}cur.satirlar.push({ad:label||'—',h:cells});}while(dates.length<5)dates.push(addDays(dates[dates.length-1]||mon,1));bolumler.forEach(b=>b.satirlar.forEach(r=>{while(r.h.length<5)r.h.push('');}));return {gunler:dates,hafta:monday(dates[0]),bolumler:bolumler.filter(b=>b.satirlar.length),not:notes.join('\n')};}
function parseBirikim(grid){const hi=grid.findIndex(r=>r&&r.filter(c=>/\(\s*\d+/.test(String(c))).length>=3);if(hi<0)return null;const hdr=grid[hi];const heds=[];let topJ=-1;hdr.forEach((c,j)=>{if(j===0)return;const s=String(c==null?'':c).trim();if(!s)return;if(/TOPLAM/i.test(s)){topJ=j;return;}const nums=[...s.matchAll(/\(\s*(\d+)/g)].map(x=>+x[1]);const ad=s.replace(/\s*\(\s*\d+[^)]*\)?/g,'').replace(/\s+/g,' ').trim()||s;heds.push({j,ad,ay:nums.reduce((a,b)=>a+b,0)});});const kisiler=[];for(let i=hi+1;i<grid.length;i++){const r=grid[i]||[];const ad=String(r[0]==null?'':r[0]).trim();if(!ad)continue;const d={};heds.forEach(h=>{const v=String(r[h.j]==null?'':r[h.j]).replace(/\s+/g,' ').trim();if(v&&!/^[-–—]+$/.test(v))d[h.ad]=v;});kisiler.push({ad,toplam:topJ>=0?String(r[topJ]==null?'':r[topJ]).trim():'',d});}return {hedefler:heds.map(h=>({ad:h.ad,ay:h.ay})),kisiler};}

 const ay=+(S.ayar.egitimAy)||60;const yil=Math.max(1,Math.round(ay/12));const Y=365.25;const pct=Math.min(100,Math.round(s.totGun/(ay*30.4375)*100));
 const segs=Array.from({length:yil},(_,y)=>{const f=Math.max(0,Math.min(1,(s.totGun-y*Y)/Y));return `<i><b style="width:${Math.round(f*100)}%"></b></i>`;}).join('');
 return `<section class="card sum"><div class="sum-top"><span class="dotline"><i class="dot"></i>Asistanlıkta</span><span class="yr">${s.yil}. yıl · %${pct}</span></div>

function homeDuty(){const t=curDutyDate();const yar=S.ui.hnb==='yarin';const g=yar?addDays(t,1):t;const nx=addDays(g,1);const doc=S.nobet[monthKey(g)];const row=doc&&doc.gunler&&doc.gunler[g];const tok=me()?myTok():'';
 const sg=`<div class="nbc-seg" role="tablist">${[['bugun','Bu nöbet'],['yarin','Sonraki']].map(o=>`<button role="tab" aria-selected="${(S.ui.hnb||'bugun')===o[0]}" data-act="set" data-key="hnb" data-val="${o[0]}">${o[1]}</button>`).join('')}</div>`;
 let body='';
 if(!row)body='<p class="nbc-empty">Bu gün için nöbet listesi yok.</p>';
 else{const grp={},ord=[];colsOf(doc).forEach(c=>{const v=String(row[c.i]||'').trim();if(!v)return;const k=c.grup||c.ad;if(!grp[k]){grp[k]={uz:[],as:[]};ord.push(k);}grp[k][c.tip==='uzman'?'uz':'as'].push({v:up(v),et:c.etiket||''});});

  body=ord.map(k=>{const x=grp[k];return `<div class="nbc-g"><div class="nbc-h">${esc(title(k))}</div><div class="nbc-n">${x.uz.map(u=>`<b class="${tok&&u.v===tok?'me':''}">${esc(u.v)}</b>`).join(', ')}${x.uz.length&&x.as.length?'<span class="nbc-d">·</span>':''}${x.as.map(nm).join(', ')}</div></div>`;}).join('');}
 return `<section class="card sum nbc"><div class="nbc-top"><div class="nbc-tt"><span class="nbc-dot${yar?'':' live'}"></span><span>${yar?'Sonraki nöbet':'Şu an nöbette'}</span><small>${esc(fmtShort(g).replace(/ \S+$/,''))} · ${esc(fmtShort(nx).replace(/ \S+$/,''))} ${kadarTxt(devirH(nx))}</small></div>${sg}</div>${body}<div class="nbc-ft">${(()=>{if(!me()||S.viewOnly)return '';const n=nextDuty();if(!n)return '<span class="nbc-my">Yaklaşan nöbetin yok</span>';const t=todayStr();const w=n.date===t?'Bugün nöbettesin':n.date===addDays(t,1)?'Yarın nöbettesin':'Sıradaki nöbetin: '+fmtShort(n.date);return `<span class="nbc-my">${ic('cal')}<b>${esc(w)}</b></span>`;})()}<a class="nbc-all" href="#nobet">Tüm liste ${ic('next')}</a></div></section>`;}

function tileSub(go){const t=todayStr();try{switch(go){
 case 'nobet':{if(me()&&myTip()==='asistan'){const w=dutyWord(nextDuty());if(w)return [w,/Bugün|Yarın/.test(w)];}return ['Aylık asistan listesi'];}
 case 'uzman':{if(me()&&myTip()==='uzman'){const w=dutyWord(nextDuty());if(w)return [w,/Bugün|Yarın/.test(w)];}const d=S.nobet[monthKey(t)];if(d&&d.gunler&&d.gunler[t]){const g=groups(d.gunler[t],colsOf(d,'uzman'))[0];if(g)return [`Bugün ${g.g}: ${g.items.map(i=>up(i.v)).join(', ')}`];}return ['Aylık uzman listesi'];}
 case 'haftalik':{const tok=myTok();const doc=S.haftalik[`${myTip()}-${monday(t)}`];const r=myRows(doc,t,tok);if(r.length)return ['Bugün: '+r.join(', '),true];return ['Masa ve nöbet dağılımı'];}
 case 'islem':{if(!S.uid||S.viewOnly)return ['Kişisel işlem karnesi'];const st=islemGet();return [`${AY[new Date().getMonth()]}: ${sumMonth(st,monthKey(t))} işlem`];}
 case 'rotasyon':{const r=rotOf(myTok());if(r)return [`${AY[pd(rotCurKey()+'-01').getMonth()]}: ${r}`];return ['Bu ay ve rotasyon karnesi'];}
 case 'seminer':{const n=Object.values(S.seminer).filter(s=>s.tarih>=t).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1)[0];if(n)return [`${fmtShort(n.tarih)} · ${n.tur||'Seminer'}`];return ['Haftalık program'];}
 case 'kongre':{const n=Object.values(S.kongre).filter(k=>(k.bitis||k.baslangic)>=t).sort((a,b)=>a.baslangic<b.baslangic?-1:1)[0];if(n){const g=dayDiff(t,n.baslangic);return [g>0?`${n.ad} · ${g} gün`:`${n.ad} · sürüyor`];}return ['Kongreler ve katılanlar'];}

 case 'degisim':{const a=tkActive();const mine=a.filter(x=>x.u===S.uid&&x.durum==='teklif').length;const ap=yetkili()?a.filter(x=>x.durum==='kabul').length:0;if(mine)return [`${mine} teklif geldi`,true];if(ap)return [`${ap} onay bekliyor`,true];const o=a.filter(x=>x.durum==='acik').length;return [o?`${o} açık ilan`:'İlan ver, nöbet devral'];}
 case 'uzayan':{const a=uzToday().filter(x=>x.durum!=='bitti');if(a.length){const b=a.filter(x=>!x.karar).length;return [`${a.length} masa devam ediyor${b?` · ${b} karar bekliyor`:''}`,true];}return [uzWin()?'Uzayan masa var mı? Ekle':'Devir öncesi uzayan masalar'];}

 case 'kadro':{const a=Object.keys(S.kayit).filter(id=>S.onay[id]&&S.kayit[id].unvan!=='uzman').length;const u=uzmanList().length;return [`${a} asistan · ${u} uzman`];}
 }}catch(e){console.warn(e);}return [''];}

let annHold=0;const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
function annSync(tr){const n=tr.children.length;const i=Math.max(0,Math.min(n-1,Math.round(tr.scrollLeft/(tr.clientWidth||1))));S.ui.annI=i;const bar=tr.parentElement;bar.querySelectorAll('.annbar-dots i').forEach((d,j)=>d.classList.toggle('on',j===i));const c=bar.querySelector('#annbar-c');if(c)c.textContent=`${i+1}/${n}`;}
function annRestore(){const tr=document.getElementById('annbar');if(!tr)return;const i=Math.min(S.ui.annI||0,tr.children.length-1);tr.scrollLeft=i*tr.clientWidth;}
setInterval(()=>{const tr=document.getElementById('annbar');if(!tr||document.hidden||RMQ.matches||Date.now()<annHold)return;const n=tr.children.length;if(n<2)return;const i=(Math.round(tr.scrollLeft/(tr.clientWidth||1))+1)%n;tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'});},5000);
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.id==='annbar')annSync(t);},true);
['pointerdown','focusin','mouseover','touchstart'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;if(t&&t.closest&&t.closest('.annbar'))annHold=Date.now()+8000;},{passive:true}));

function diffYMD(a,b){const s=pd(a),e=pd(b);let y=e.getFullYear()-s.getFullYear(),m=e.getMonth()-s.getMonth(),d=e.getDate()-s.getDate();if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate();}if(m<0){y--;m+=12;}return {y,m,d};}
function fmtYMD(o){return [o.y?`${o.y} yıl`:'',o.m?`${o.m} ay`:'',o.d?`${o.d} gün`:''].filter(Boolean).join(' ')||'0 gün';}
function fmtPrev(p){return [p.ay?`${p.ay} ay`:'',p.gun?`${p.gun} gün`:''].filter(Boolean).join(' ');}
function sure(k){if(!k||!k.baslangic)return null;const t=todayStr();const pa=Math.max(0,Math.round(+k.oncekiAy||0)),pg=Math.max(0,Math.round(+k.oncekiGun||0));const prev=(pa||pg)?{ay:pa,gun:pg,kurum:k.oncekiKurum||''}:null;if(k.baslangic>t)return {basladi:false,prev,kalan:dayDiff(t,k.baslangic),totGun:pa*30+pg};const cur=diffYMD(k.baslangic,t);const gun=dayDiff(k.baslangic,t)+1;let y=cur.y,m=cur.m+pa,d=cur.d+pg;m+=Math.floor(d/30);d%=30;y+=Math.floor(m/12);m%=12;return {basladi:true,gun,cur,prev,tot:{y,m,d},totGun:gun+pa*30+pg,yil:y+1};}
function kidemOf(k){const s=sure(k);if(!s)return '';if(!s.basladi)return `${s.kalan} gün sonra başlıyor`;return `${s.yil}. yıl · ${s.gun.toLocaleString('tr-TR')}. gün${s.prev?` (+${fmtPrev(s.prev)}${s.prev.kurum?' '+s.prev.kurum:''})`:''}`;}
function resCard(){const k=me();if(!k||k.unvan==='uzman')return '';const s=sure(k);
 if(!s)return `<a class="banner" href="#profil" style="text-decoration:none;color:inherit"><div><b>Asistanlık başlangıç tarihini ekle</b><small>Asistanlıkta geçen gününü burada görürsün.</small></div></a>`;
 if(!s.basladi)return `<section class="card res"><div class="res-top"><div><span class="hint">Asistanlığın başlamasına</span><b class="big">${s.kalan} gün</b></div></div><p class="res-sub">Başlangıç: ${esc(fmtDate(k.baslangic))}</p></section>`;
 return `<section class="card res"><div class="res-top"><div><span class="hint">Asistanlıkta</span><b class="big">${s.gun.toLocaleString('tr-TR')}. gün</b></div><span class="pill ok">${s.yil}. yıl</span></div><p class="res-sub">Başlangıç: ${esc(fmtDate(k.baslangic))} · ${esc(fmtYMD(s.cur))}</p>${s.prev?`<p class="res-sub">Önceki kurum${s.prev.kurum?' ('+esc(s.prev.kurum)+')':''}: ${esc(fmtPrev(s.prev))} · <b>Toplam ${esc(fmtYMD(s.tot))}</b></p>`:''}</section>`;}
function pendingIds(){return Object.keys(S.kayit).filter(id=>!S.onay[id]);}

/* ---------- rotasyon birikimi (aylık listelerden otomatik) ---------- */
const nAd=s=>normName(s).replace(/[^A-ZÇĞİÖŞÜ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function birKadar(b){if(b&&b.kadarAy)return b.kadarAy;const ms=rotMonths();return ms.length?shiftMonth(ms[0],-1):monthKey(todayStr());}
function svcHedef(ad,b){const m=(b.esle||{})[ad];if(m!==undefined)return m||null;const a=nAd(ad);const hs=b.hedefler||[];let h=hs.find(x=>nAd(x.ad)===a);if(h)return h.ad;const f=a.split(' ')[0];h=hs.find(x=>{const n=nAd(x.ad);return n.startsWith(a)||a.startsWith(n)||(f.length>=3&&n.split(' ')[0]===f);});if(h)return h.ad;const GEN=new Set(['C','ROTASYONU','AMELİYATHANE','SERVİSİ','POLİ']);const ta=a.split(' ').filter(x=>x.length>=3&&!GEN.has(x));h=hs.find(x=>nAd(x.ad).split(' ').some(t=>t.length>=3&&ta.includes(t)));return h?h.ad:null;}
function birIdx(tok,b){const k=Object.values(S.kayit).find(x=>up(x.kisaAd)===tok&&x.unvan!=='uzman');if(k){const i=matchBirikim(k);if(i!=null)return i;}const c=[];(b.kisiler||[]).forEach((p,i)=>{if(nAd(p.ad).split(' ').includes(tok))c.push(i);});return c.length===1?c[0]:null;}
function birAuto(){const b=S.rotasyon.birikim;if(!b)return null;const kd=birKadar(b),now=monthKey(todayStr());const add={},miss=new Set(),noP=new Set();const ms=rotMonths().filter(m=>m>kd&&m<=now);
 ms.forEach(m=>{(S.rotasyon['ay-'+m].servisler||[]).forEach(sv=>{const h=svcHedef(sv.ad,b);if(!h){miss.add(sv.ad);return;}(sv.kisiler||[]).forEach(tok=>{const i=birIdx(up(tok),b);if(i==null){noP.add(up(tok));return;}add[i]=add[i]||{};add[i][h]=(add[i][h]||0)+1;});});});
 return {kd,ms,add,miss:[...miss],noP:[...noP]};}
function birView(){const b=S.rotasyon.birikim;if(!b)return null;const a=birAuto();if(!a||!a.ms.length)return b;const v=clone(b);
 v.kisiler.forEach((p,i)=>{const ad=a.add[i];if(!ad)return;let tot=0;p.d=p.d||{};for(const h in ad){const n=ad[h];tot+=n;const o=p.d[h]||'';p.d[h]=!o?`${n} ay`:/^\s*\d+\s*ay\s*$/i.test(o)?`${numSum(o)+n} ay`:`${o} +${n} ay`;}const t=p.toplam||'';p.toplam=!t?`${tot} ay`:/^\s*\d+\s*ay\s*$/i.test(t)?`${numSum(t)+tot} ay`:`${t} +${tot} ay`;});
 v._auto=a;return v;}

const rotTop=(p,hs)=>(hs||[]).reduce((a,h)=>a+numSum((p.d||{})[h.ad]||''),0);
function birKayit(i){const e=Object.entries(S.kayit).find(([id,k])=>S.onay[id]&&k.unvan!=='uzman'&&matchBirikim(k)===i);return e?e[1]:null;}
function resAy(i){const k=birKayit(i);const x=k&&sure(k);return x&&x.basladi?x.tot.y*12+x.tot.m:null;}
function rotCheck(i,p,hs){const t=rotTop(p,hs),r=resAy(i);return {t,r,bad:r!=null&&Math.abs(t-r)>1,fark:r==null?0:t-r};}

 if(first){let fresh=true;try{fresh=!sessionStorage.getItem('ap-giris-'+S.uid);sessionStorage.setItem('ap-giris-'+S.uid,'1');}catch(e){}if(fresh)logEv('giris',r);}

 const x={acik:['Bu cihazda açık','Yeni duyuru, nöbet listesi, nöbet değişimleri, sohbet mesajları'+(yetkili()?' ve yönetici uyarıları':'')+' telefonuna bildirim olarak gelir.',`<label class="chk" style="margin:-4px 0 6px"><input type="checkbox" data-ch="pushChat"${pushChat()?' checked':''}>Sohbet mesajlarında da bildir</label><button class="btn sm ghost" data-act="pushOff">Bu cihazda kapat</button>`],

 const H=S.hareket;const dayOf=ts=>ymd(new Date(ts));const appr=Object.keys(S.kayit).filter(id=>S.onay[id]);
 const todayU=new Set(H.filter(x=>dayOf(x.ts)===t).map(x=>x.u));const w7=addDays(t,-6);const weekU=new Set(H.filter(x=>dayOf(x.ts)>=w7).map(x=>x.u));

 if(S.izlErr||(S.denied&&(S.denied.oturum||S.denied.hareket)))h+=`<section class="card" style="border:1px solid #E0A100;background:#FFF4C9;color:#3E2B04"><b>Firebase kuralları güncel değil</b><p style="margin:6px 0 0">Kullanıcıların giriş kayıtları sunucuya yazılamıyor, bu yüzden pano boş görünüyor. Firebase Console → Firestore → Rules sekmesine son kuralları yapıştırıp Publish'e bas.</p></section>`;
 h+=`<section class="card"><div class="card-h"><h2>Şu an çevrimiçi</h2><span class="live-dot" aria-hidden="true"></span></div>${on.length?`<ul class="alist">${on.map(x=>`<li class="arow"><div class="arow-t"><b><span class="on-dot"></span>${esc(x.ad||'—')}${x.u===S.uid?' (sen)':''}</b><small>${esc(SAYFA[x.sayfa]||x.sayfa||'')} · ${esc(x.cihaz||'')} · ${agoTxt(x.son)}</small></div></li>`).join('')}</ul>`:'<p class="muted">Şu an portalda kimse yok.</p>'}</section>`;
 const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));const dau=days.map(d=>new Set(H.filter(x=>dayOf(x.ts)===d).map(x=>x.u)).size);const mx=Math.max(1,...dau);
 const gir=d=>H.filter(x=>x.tur==='giris'&&dayOf(x.ts)===d).length,pvD=d=>H.filter(x=>x.tur==='sayfa'&&dayOf(x.ts)===d).length;const avg=Math.round(dau.slice(-7).reduce((a,b)=>a+b,0)/7*10)/10;

 h+=`<section class="card"><div class="card-h"><h2>Günlük aktif kişi</h2><span class="muted">son 14 gün</span></div><div class="dau" role="img" aria-label="Son 14 günde günlük aktif kişi sayısı">${days.map((d,i)=>`<div class="dau-c" title="${esc(fmtShort(d))}: ${dau[i]} kişi"><span class="dau-v">${dau[i]||''}</span><div class="dau-b" style="height:${Math.round(dau[i]/mx*100)}%"></div><span class="dau-l">${+d.slice(8)}</span></div>`).join('')}</div></section>`;

function drawWave(){const c=document.getElementById('wave');if(!c||!c.getContext)return;const box=c.parentElement;const w=Math.max(box.clientWidth||0,window.innerWidth||0),h=Math.max(box.clientHeight||0,window.innerHeight||0);if(!w||!h)return;const dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);

 x.beginPath();x.moveTo(U[0][0],U[0][1]);x.bezierCurveTo(U[1][0],U[1][1],U[2][0],U[2][1],U[3][0],U[3][1]);x.lineTo(L[3][0],L[3][1]);x.bezierCurveTo(L[2][0],L[2][1],L[1][0],L[1][1],L[0][0],L[0][1]);x.closePath();x.fillStyle=g;x.fill();

/* duyuru */
function annForm(a,id){openSheet(id?'Duyuruyu düzenle':'Yeni duyuru',`<label class="fld"><span>Başlık</span><input id="a-b" value="${esc(a.baslik||'')}" maxlength="120"></label><label class="fld"><span>Metin</span><textarea id="a-m" rows="6">${esc(a.metin||'')}</textarea></label><div class="row2"><label class="fld"><span>Son gün</span><input id="a-e" type="date" value="${esc(a.bitis!==undefined?a.bitis:(a.baslik?'':addDays(todayStr(),7)))}" min="${todayStr()}"${a.baslik&&!a.bitis?' disabled':''}></label><label class="chk" style="align-self:end"><input type="checkbox" id="a-sz"${a.baslik&&!a.bitis?' checked':''} data-ch="annSz">Süresiz</label></div><p class="hint" style="margin-top:-8px">Son günden sonra duyuru ana sayfadan kalkar, Duyurular sayfasında arşivde durur.</p><label class="chk"><input type="checkbox" id="a-o"${a.onemli?' checked':''}>Önemli olarak işaretle</label><label class="chk"><input type="checkbox" id="a-s"${a.sabit?' checked':''}>En üstte sabitle</label><button class="btn block" data-act="annSave" data-id="${esc(id||'')}">Yayınla</button>${id?`<button class="btn block danger" data-act="annDel" data-id="${esc(id)}">${ic('trash')}Duyuruyu sil</button>`:''}`);}
A.annNew=()=>annForm({},null);
A.annEdit=el=>annForm(S.duyurular[el.dataset.id]||{},el.dataset.id);
A.annSave=async el=>{const id=el.dataset.id;const b=$('#a-b').value.trim(),m=$('#a-m').value.trim();if(!b)return toast('Başlık gir.','err');const old=id?S.duyurular[id]:null;const sz=$('#a-sz').checked;const bitis=sz?'':($('#a-e').value||'');const body={baslik:b,metin:m,bitis,onemli:$('#a-o').checked,sabit:$('#a-s').checked,tarih:old&&old.tarih||new Date().toISOString(),yazan:old&&old.yazan||S.uid||''};const ref=id?S.db.doc('duyurular/'+id):S.db.collection('duyurular').doc();if(await W(()=>ref.set(Object.assign(body,stamp())),id?'Duyuru güncellendi':'Duyuru yayınlandı')){closeSheet();annWa(body,!id);}};
function annTxt(a){return `📢 *${a.onemli?'ÖNEMLİ · ':''}${a.baslik}*${a.metin?`\n\n${a.metin}`:''}${a.bitis?`\n\nSon gün: ${fmtDate(a.bitis)}`:''}${PORTAL_URL?`\n\nAsistan Portal: ${PORTAL_URL}`:''}`;}
function annWa(a,yeni){const t=annTxt(a);openSheet(yeni?'Duyuru yayınlandı':'Duyuru güncellendi',`<p class="entry-note" style="padding:0">Herkese haber vermek için bölüm WhatsApp grubuna gönder.</p><pre class="share-pre">${esc(t)}</pre><div class="share-acts"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">${ic('wa')}WhatsApp grubuna gönder</a><button class="btn ghost" data-act="closeSheet">Şimdi değil</button></div><p class="hint">WhatsApp açılınca grubu seçip gönder.</p>`);}
A.annDel=async el=>{if(!await askConfirm('Bu duyuru silinsin mi?','Sil'))return;if(await W(()=>S.db.doc('duyurular/'+el.dataset.id).delete(),'Duyuru silindi'))closeSheet();};

function colCfgRead(n,old){return Array.from({length:n},(_,j)=>({ad:$('#cc-n-'+j).value.trim()||`Sütun ${j+1}`,tip:$('#cc-t-'+j).value,grup:$('#cc-g-'+j).value.trim()||$('#cc-n-'+j).value.trim(),etiket:(old&&old[j]&&old[j].etiket)||''}));}

function subscribeAll(){const db=S.db;const col=(key,path)=>sub(key,db.collection(path),snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=stdDoc(d.data());});S[key]=o;if(key==='onay')accessChanged();});
 col('kayit','kayit');col('takas','takas');col('izin','izin');col('izdonem','izdonem');
 {const c=db.collection('sohbet');if(c.recent)sub('sohbet',c.recent(150,'ts'),snap=>{S.sohbet=snap.docs.map(d=>Object.assign({id:d.id},stdDoc(d.data()))).sort((a,b)=>a.ts-b.ts);});}col('onay','onay');col('duyurular','duyurular');col('nobet','nobet');col('haftalik','haftalik');col('rotasyon','rotasyon');col('seminer','seminer');col('kongre','kongre');col('katilim','katilim');col('vizit','vizit');{const c=db.collection('uzayan');if(c.recent)sub('uzsor',db.collection('uzsor').recent(6,'ts'),snap=>{S.uzsor=snap.docs.map(d=>Object.assign({id:d.id},stdDoc(d.data())));});sub('uzayan',c.recent(120,'ts'),snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=stdDoc(d.data());});S.uzayan=o;});}
 col('geri','geribildirim');if(S.uid){const gc=db.collection('geribildirim');if(gc.where)sub('geriMine',gc.where('u',S.uid),snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=stdDoc(d.data());});S.geriMine=o;});}
 sub('yetki',db.doc('yetki/liste'),s=>{const d=s.exists?s.data():null;S.yetki=d&&Array.isArray(d.uids)?d.uids.slice():[];accessChanged();});
 sub('ayar',db.doc('ayar/genel'),s=>{S.ayar=s.exists?s.data():{};});
 sub('kadro',db.doc('kadro/uzmanlar'),s=>{S.kadro=s.exists?s.data():{uzmanlar:[]};});
 if(S.uid&&!S.viewOnly)sub('kisiMe',db.doc('kisi/'+S.uid),s=>{S.kisiMe=s.exists?s.data():null;});
 if(S.owner){col('kisi','kisi');col('oturum','oturum');const hc=db.collection('hareket');if(hc.recent)sub('hareket',hc.recent(600,'ts'),snap=>{S.hareket=snap.docs.map(d=>stdDoc(d.data())).sort((a,b)=>b.ts-a.ts);});}
 if(S.uid)sub('islem',db.doc(`data/users/${S.uid}/islem`),s=>{S.islem=s.exists?s.data():null;if(!iDirty&&!iSaving)S.islemLocal=null;});
 setTimeout(()=>{if(!dataReady()){S.slow=true;render();}},10000);}
async function init(){render();drawWave();
 if(!window.FB_CONFIG){S.state='nodb';render();return;}
 const c=await (async()=>{for(let i=0;i<200;i++){if(window.claude)return window.claude;await new Promise(r=>setTimeout(r,50));}return null;})();if(!c){S.state='nodb';render();return;}let user=null,db=null;try{[user,db,S.dl,S.push]=await Promise.all([c.use('user'),c.use('db'),c.use('downloads'),c.use('push')]);}catch(e){console.warn(e);}
 if(!db||!user){S.state='nodb';render();return;}S.db=db;S.user=user;
 user.onAuth(async u=>{unsubAll();S.uid=u?u.uid:null;S.authEmail=u?u.email:null;S.owner=false;
  if(!u){S.state='anon';S.hasOwner=await user.hasOwner();render();return;}
  S.state='loading';render();{const ow=await user.isOwner();if(!S.owner)S.owner=ow;}S.hasOwner=ow_or(await user.hasOwner());S.state='ready';subscribeAll();render();});
 setTimeout(()=>{if(S.state==='loading'){S.slow=true;render();}},12000);}
init();
})();
</script>
